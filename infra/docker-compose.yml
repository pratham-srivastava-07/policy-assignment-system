services:
  postgres:
    image: postgres:16-alpine
    container_name: policy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
     - "5432:5432"
    volumes:
     - postgres-data:/var/lib/postgresql/data

  # The reconciliation queue's backing store.
  #
  # The outbox in Postgres is what makes a job durable — it commits with the
  # state change that needs it. Redis is only the hand-off from the relay to the
  # BullMQ worker, so losing it loses in-flight jobs, never the record that they
  # were owed: the rows are still PENDING and the next poll re-enqueues them.
  redis:
    image: redis:7-alpine
    container_name: policy-redis
    restart: unless-stopped
    ports:
     - "6380:6379"
    volumes:
     - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data: